<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="dl.title">下载 WV Chat</title>
  <meta name="description" content="下载 WV Chat 最新版本，支持 Android、Windows 与 iOS。" data-i18n-attr="content:dl.desc">
  <link rel="icon" type="image/png" href="/assets/wv-chat-logo.png">
  <link rel="preconnect" href="https://api.dev.example.com" crossorigin>
  <link rel="dns-prefetch" href="https://api.dev.example.com">
  <style>
    :root {
      --blue: #007aff;
      --green: #2fd084;
      --ink: #172033;
      --muted: #657084;
      --line: #e7ebf2;
      --bg: #f6f8fc;
      --card: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--blue); text-decoration: none; }
    .wrap { width: min(960px, calc(100% - 40px)); margin: 0 auto; }

    header {
      background: rgba(255,255,255,.85);
      border-bottom: 1px solid var(--line);
      position: sticky; top: 0; z-index: 10;
      backdrop-filter: saturate(180%) blur(12px);
    }
    nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 0; gap: 16px;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 19px; color: var(--ink); }
    .logo { width: 38px; height: 38px; border-radius: 10px; display: block; object-fit: cover;
      box-shadow: 0 8px 20px rgba(0,122,255,.22); }
    .links { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; font-size: 15px; }
    .links a { color: var(--muted); }
    .links a.active, .links a:hover { color: var(--blue); }
    .lang-btn { min-height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--ink); font-weight: 700; font-size: 14px; cursor: pointer; }
    .lang-btn:hover { border-color: var(--blue); color: var(--blue); }

    main { padding: 56px 0 72px; }

    .hero { text-align: center; padding: 12px 0 8px; }
    .hero-logo { width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 18px 40px rgba(0,122,255,.22); }
    .hero h1 { margin: 20px 0 8px; font-size: clamp(30px, 5vw, 42px); letter-spacing: -.5px; }
    .hero .lead { color: var(--muted); margin: 0 auto; max-width: 560px; font-size: 16px; }

    .platforms { margin-top: 36px; }
    .tabs {
      display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 24px;
    }
    .tab {
      border: 1px solid var(--line); background: var(--card); color: var(--muted);
      padding: 10px 22px; border-radius: 999px; cursor: pointer; font-size: 15px; font-weight: 600;
      transition: all .15s ease;
    }
    .tab:hover { border-color: var(--blue); color: var(--blue); }
    .tab.active { background: var(--blue); border-color: var(--blue); color: #fff; box-shadow: 0 8px 20px rgba(0,122,255,.28); }

    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 22px;
      padding: 40px; box-shadow: 0 18px 48px rgba(31,49,83,.08);
    }
    .release { display: grid; grid-template-columns: 1fr auto; gap: 36px; align-items: center; }
    @media (max-width: 720px) { .release { grid-template-columns: 1fr; text-align: center; } }

    .app-title { display: flex; align-items: center; gap: 16px; }
    @media (max-width: 720px) { .app-title { justify-content: center; } }
    .app-logo { width: 64px; height: 64px; border-radius: 16px; box-shadow: 0 10px 24px rgba(0,122,255,.2); }
    .app-name { font-size: 24px; font-weight: 800; }
    .app-version { color: var(--muted); font-size: 15px; }

    .meta { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 18px; font-size: 13px; color: var(--muted); }
    .meta b { color: var(--ink); font-weight: 600; }
    .sha { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

    .notes { color: var(--muted); margin-top: 20px; white-space: pre-wrap; font-size: 14px;
      border-top: 1px dashed var(--line); padding-top: 18px; }

    .actions { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-top: 26px; }
    @media (max-width: 720px) { .actions { justify-content: center; } }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 52px; padding: 0 38px; border-radius: 13px;
      background: var(--blue); color: #fff; font-weight: 700; font-size: 17px;
      box-shadow: 0 12px 28px rgba(0,122,255,.3); transition: transform .1s ease, filter .1s ease;
    }
    .btn:hover { filter: brightness(1.06); transform: translateY(-1px); }

    .qr { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .qr-box { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 10px; }
    .qr-box canvas, .qr-box img { display: block; }
    .qr-hint { color: var(--muted); font-size: 13px; }

    .coming {
      text-align: center; padding: 56px 0; color: var(--muted);
    }
    .coming .big { font-size: 40px; }
    .coming h3 { color: var(--ink); font-size: 20px; margin: 16px 0 6px; }
    .coming p { margin: 0; }

    .state { color: var(--muted); padding: 32px 0; text-align: center; }
    .hint { text-align: center; color: var(--muted); font-size: 13px; margin-top: 22px; }

    footer { padding: 36px 0; color: var(--muted); border-top: 1px solid var(--line); text-align: center; font-size: 14px; }
    footer p { margin: 6px 0; }
    footer a { color: inherit; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <nav>
        <a class="brand" href="/index.html"><img class="logo" src="/assets/wv-chat-logo.png" alt="WV Chat" width="38" height="38"><span>WV Chat</span></a>
        <div class="links">
          <a href="/index.html#company" data-i18n="nav.company">公司简介</a>
          <a href="/index.html#features" data-i18n="nav.features">功能</a>
          <a href="/download.html" class="active" data-i18n="nav.download">下载</a>
          <a href="/developer.html" data-i18n="nav.developer">开发者</a>
          <a href="/index.html#support" data-i18n="nav.support">技术支持</a>
          <a href="/cancel.html" data-i18n="nav.cancel">账号注销</a>
          <a href="/privacy.html" data-i18n="nav.privacy">隐私政策</a>
          <a href="/terms.html" data-i18n="nav.terms">用户协议</a>
          <button class="lang-btn" type="button" data-lang-toggle>EN</button>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <img class="hero-logo" src="/assets/wv-chat-logo.png" alt="WV Chat" width="96" height="96" decoding="async">
      <h1 data-i18n="dl.h1">下载 WV Chat</h1>
      <p class="lead" data-i18n="dl.lead">端到端加密即时通讯，私密消息仅参与设备可见。当前支持 Android、Windows 与 iOS。</p>
    </section>

    <section class="platforms">
      <div class="wrap">
        <div class="tabs" id="tabs">
          <button class="tab active" data-platform="android">Android</button>
          <button class="tab" data-platform="windows">Windows</button>
          <button class="tab" data-platform="ios">iOS</button>
          <button class="tab" data-platform="macos">macOS</button>
        </div>
        <div class="card" id="card">
          <div class="state" id="state">正在获取最新版本…</div>
        </div>
      </div>
    </section>

    <p class="hint" data-i18n="dl.hint">下载安装即代表你已阅读并同意 <a href="/privacy.html" data-i18n="nav.privacy">隐私政策</a> 与 <a href="/terms.html" data-i18n="nav.terms">用户协议</a>。</p>
  </main>

  <footer>
    <div class="wrap">
      <p data-i18n="footer.copyright">©2026 深圳市译识编元科技有限公司</p>
      <p><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">粤ICP备2026106235号-1</a></p>
    </div>
  </footer>

  <script src="/js/i18n.js"></script>
  <script src="/assets/qrcode.min.js" defer></script>
  <script>
    (function () {
      var card = document.getElementById('card');
      var tabs = document.getElementById('tabs');
      var base = 'https://api.dev.example.com/api/v1/client/releases/latest?platform=';
      var currentPlatform = 'android';
      var currentSeq = 0;
      var cachePrefix = 'wv-dl-cache:';
      var cacheTtlMs = 5 * 60 * 1000;

      function readCache(platform) {
        try {
          var raw = localStorage.getItem(cachePrefix + platform);
          if (!raw) return null;
          var item = JSON.parse(raw);
          if (!item || !item.data) return null;
          if (Date.now() - item.fetchedAt > cacheTtlMs) return null;
          return item.data;
        } catch (e) { return null; }
      }

      function writeCache(platform, data) {
        try {
          localStorage.setItem(cachePrefix + platform, JSON.stringify({ data: data, fetchedAt: Date.now() }));
        } catch (e) { /* 忽略隐私模式/配额错误 */ }
      }

      function t(key) {
        var lang = (window.WV && window.WV.getLang) ? window.WV.getLang() : 'zh';
        var d = (window.WV && window.WV.dict && window.WV.dict[lang]) ? window.WV.dict[lang] : {};
        return d[key] != null ? d[key] : key;
      }

      // 尚未发布的平台。
      var coming = {
        ios: function () { return t('dl.coming.ios'); },
        macos: function () { return t('dl.coming.macos'); }
      };

      function escapeHtml(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      function fmtBytes(n) {
        if (n == null) return '';
        return (n / 1024 / 1024).toFixed(1) + ' MB';
      }

      function renderComing(text) {
        card.innerHTML = '<div class="coming"><div class="big">🚧</div><h3>' + escapeHtml(t('dl.coming.title')) + '</h3><p>' + escapeHtml(text) + '</p></div>';
      }

      function pickArtifact(data, platform) {
        var isDesktop = platform === 'windows';
        var artifacts = data.artifacts || [];
        var preferred = isDesktop ? ['exe', 'msix'] : ['apk'];
        for (var i = 0; i < preferred.length; i++) {
          var hit = artifacts.find(function (a) {
            return a.downloadUrl && a.packageType && a.packageType.toLowerCase() === preferred[i];
          });
          if (hit) return hit;
        }
        // 桌面端不回退到 APK；仅移动端回退到首个有下载地址的产物
        if (!isDesktop) {
          var first = artifacts.find(function (a) { return a.downloadUrl; });
          if (first) return first;
        }
        return null;
      }

      function renderRelease(data, platform) {
        var version = data.version || '';
        var notes = data.releaseNotes || '';
        var isDesktop = platform === 'windows';
        var art = pickArtifact(data, platform);
        var downloadUrl = art ? art.downloadUrl : '';
        var sha = art && art.sha256 ? art.sha256 : '';
        var size = art ? art.sizeBytes : null;
        var platformLabel = isDesktop ? 'Windows' : 'Android';

        var html = '<div class="release">'
          + '<div>'
          +   '<div class="app-title"><img class="app-logo" src="/assets/wv-chat-logo.png" alt="WV Chat">'
          +     '<div><div class="app-name">WV Chat</div><div class="app-version">v' + escapeHtml(version) + '</div></div></div>'
          +   '<div class="meta">'
          +     (size ? '<span>' + t('dl.size') + ' <b>' + fmtBytes(size) + '</b></span>' : '')
          +     (sha ? '<span>' + t('dl.sha') + ' <b class="sha">' + escapeHtml(sha.slice(0, 16)) + '…</b></span>' : '')
          +     '<span>' + t('dl.platform') + ' <b>' + platformLabel + '</b></span>'
          +   '</div>'
          +   (notes ? '<div class="notes">' + escapeHtml(notes) + '</div>' : '')
          +   '<div class="actions">'
          +     (downloadUrl ? '<a class="btn" href="' + escapeHtml(downloadUrl) + '" target="_blank" rel="noopener noreferrer">' + t('dl.download') + '</a>' : '<span class="state">' + t('dl.noLink') + '</span>')
          +   '</div>'
          + '</div>'
          + (isDesktop ? '' : '<div class="qr">'
          +   '<div class="qr-box" id="qrcode"></div>'
          +   '<div class="qr-hint">' + t('dl.qrHint') + '</div>'
          + '</div>')
          + '</div>';

        card.innerHTML = html;

        if (!isDesktop && downloadUrl) {
          renderQr(downloadUrl);
        }
      }

      function renderQr(downloadUrl) {
        var box = document.getElementById('qrcode');
        if (!box) return;
        var opts = {
          text: downloadUrl, width: 176, height: 176,
          colorDark: '#172033', colorLight: '#ffffff', correctLevel: 2
        };
        if (window.QRCode) { new QRCode(box, opts); return; }
        // qrcode.min.js 已 defer，未就绪时动态加载后再渲染
        var s = document.createElement('script');
        s.src = '/assets/qrcode.min.js';
        s.onload = function () { new QRCode(box, opts); };
        document.head.appendChild(s);
      }

      function loadPlatform(platform) {
        var seq = ++currentSeq;
        currentPlatform = platform;
        card.innerHTML = '<div class="state">' + t('dl.loading') + '</div>';

        // 先读缓存秒开，再后台刷新
        var cached = readCache(platform);
        if (cached) renderRelease(cached, platform);

        fetch(base + platform + '&channel=stable')
          .then(function (resp) {
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            return resp.json();
          })
          .then(function (json) {
            var data = json && json.data;
            if (!data) {
              if (seq === currentSeq && !cached) renderComing(t('dl.noRelease'));
              return;
            }
            writeCache(platform, data);
            if (seq === currentSeq) renderRelease(data, platform);
          })
          .catch(function () {
            if (seq === currentSeq && !cached) renderComing(t('dl.fetchFail'));
          });
      }

      tabs.addEventListener('click', function (e) {
        var btn = e.target.closest('.tab');
        if (!btn) return;
        var platform = btn.getAttribute('data-platform');
        currentPlatform = platform;
        Array.prototype.forEach.call(tabs.children, function (c) { c.classList.remove('active'); });
        btn.classList.add('active');
        if (coming[platform]) {
          renderComing(coming[platform]());
        } else {
          loadPlatform(platform);
        }
      });

      document.addEventListener('wv:langchange', function () {
        if (coming[currentPlatform]) { renderComing(coming[currentPlatform]()); } else { loadPlatform(currentPlatform); }
      });

      loadPlatform('android');
    })();
  </script>
</body>
</html>
